<div class="notification-wrapper">
  <button
    #triggerButton
    type="button"
    class="icon-btn notification-trigger"
    aria-label="Notificaciones"
    (click)="toggle()"
    [class.active]="open"
    [attr.aria-expanded]="open"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6" />
    </svg>
    @if (unreadCount > 0) {
      <span class="notification-badge">{{ unreadCount }}</span>
    }
  </button>

  @if (open) {
    <div #menuPanel class="notification-menu" role="menu" aria-label="{{ title }}" [ngStyle]="menuStyle">
      <div class="notification-menu__header">
        <div>
          <p class="notification-menu__eyebrow">{{ eyebrow }}</p>
          <h3>{{ title }}</h3>
        </div>
        @if (loading) {
          <span class="notification-menu__state">Actualizando...</span>
        }
      </div>

      @if (error) {
        <p class="notification-menu__empty notification-menu__empty--error">{{ error }}</p>
      } @else if (items.length === 0) {
        <p class="notification-menu__empty">{{ emptyMessage }}</p>
      } @else {
        <div class="notification-menu__list">
          @for (item of items; track item.id) {
            <button type="button" class="notification-menu__item" [class.notification-menu__item--read]="item.leida" (click)="selectItem(item)">
              <span class="notification-menu__dot" aria-hidden="true"></span>
              <span class="notification-menu__copy">
                <strong>{{ item.titulo }}</strong>
                <span>{{ item.detalle }}</span>
                <small>{{ item.codigoArticulo }}</small>
              </span>
            </button>
          }
        </div>

        <button type="button" class="notification-menu__footer" (click)="selectCenter()">{{ centerLabel }}</button>
      }
    </div>
  }
</div>
