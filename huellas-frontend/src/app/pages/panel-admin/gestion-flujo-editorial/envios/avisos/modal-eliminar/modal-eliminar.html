@if (isOpen) {
<app-modal-shell [title]="'Eliminar aviso'" ariaLabel="Eliminar aviso" [width]="'min(500px, 92vw)'"
  [panelClass]="'modal-card--danger'" (closed)="closeModal()">
  <div modal-body>
    @if (requestError) {
    <p class="request-error">{{ requestError }}</p>
    }
    <div class="warning-icon" aria-hidden="true">!</div>
    <p class="warning-text">
      Estás por eliminar el aviso:
      <strong>{{ selectedAvisoTitulo }}</strong>
    </p>
    <p class="warning-subtext">Esta acción no se puede deshacer. ¿Deseas continuar?</p>
  </div>
  <div modal-footer>
    <button type="button" class="modal-btn-cancelar" (click)="closeModal()" [disabled]="deleting">
      Cancelar
    </button>
    <button type="button" class="modal-btn-eliminar" (click)="confirmDelete()" [disabled]="deleting">
      {{ deleting ? 'Eliminando...' : 'Eliminar aviso' }}
    </button>
  </div>
</app-modal-shell>
}

@if (showSuccessModal) {
<app-modal-shell [title]="'Aviso eliminado'" ariaLabel="Aviso eliminado" [width]="'min(420px, 92vw)'"
  [footerClass]="'centered'" (closed)="closeSuccessModal()">
  <div modal-body class="success-content">
    <div class="success-icon" aria-hidden="true">✓</div>
    <p>La operación se realizó exitosamente.</p>
  </div>
  <div modal-footer>
    <button type="button" class="modal-btn-confirmar" (click)="closeSuccessModal()">Entendido</button>
  </div>
</app-modal-shell>
}
