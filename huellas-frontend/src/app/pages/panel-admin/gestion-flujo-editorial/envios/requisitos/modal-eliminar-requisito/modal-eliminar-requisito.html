@if (isVisible) {
<app-modal-shell
  [title]="'Eliminar requisito'"
  ariaLabel="Eliminar requisito"
  [width]="'min(500px, 92vw)'"
  [panelClass]="'modal-card--danger'"
  (closed)="closeModal()"
>
  <div modal-body>
    <p>¿Estás seguro de que deseas eliminar este requisito?</p>
    @if (requisitoTexto) {
    <div class="requisito-texto">
      "{{ requisitoTexto }}"
    </div>
    }
  </div>

  <div modal-footer>
    <button class="btn-cancelar" type="button" (click)="closeModal()">Cancelar</button>
    <button class="btn-confirmar" type="button" (click)="confirmar()">Eliminar</button>
  </div>
</app-modal-shell>
}

@if (isSuccessVisible) {
<app-modal-shell
  [title]="'¡Eliminado con éxito!'"
  ariaLabel="Requisito eliminado"
  [width]="'min(500px, 92vw)'"
  [showClose]="true"
  (closed)="closeSuccessModal()"
>
  <div modal-body class="success-body">
    <div class="success-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#10b981" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
    </div>
    <p>El requisito ha sido eliminado correctamente del sistema.</p>
  </div>

  <div modal-footer>
    <button class="btn-success" type="button" (click)="closeSuccessModal()">Aceptar</button>
  </div>
</app-modal-shell>
}
