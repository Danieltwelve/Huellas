<section class="publicacion-page">
  <header class="page-header">
    <div>
      <h1>Publicación</h1>
      <p>Publica una nueva edición con 10 artículos y consulta el archivo de ediciones publicadas.</p>
    </div>
  </header>

  <app-articulos [seleccionadosIds]="selectedArticuloIds" (seleccionCambiada)="onSeleccionArticulosCambia($event)">
    <div formulario-edicion>
      @if (errorPublicacion) {
      <div class="error-message">
        ⚠️ {{ errorPublicacion }}
      </div>
      }

      <div class="form-group">
        <label class="form-label">
          <span class="label-text">Escoger Edición</span>
          <select [(ngModel)]="edicionIdSeleccionada" [disabled]="loading" class="custom-select"
            (change)="onEdicionCambia()">
            <option [ngValue]="null">Selecciona una edición</option>
            @for (edicion of ediciones; track edicion.id) {
            <option [ngValue]="edicion.id">
              Vol. {{ edicion.volumen }} Núm. {{ edicion.numero }} ({{ edicion.anio }}): {{ edicion.titulo }}
            </option>
            } @empty {
            <option disabled>No hay ediciones para publicar</option>
            }
          </select>
        </label>
      </div>

      <div class="panel-card__footer">
        <button type="button" class="btn-primary" (click)="publicarEdicion()" [disabled]="publishing">
          {{ publishing ? 'Publicando...' : 'Publicar edición' }}
        </button>
      </div>
    </div>
  </app-articulos>

  @if (error) {
  <div class="alert alert--error" role="alert">
    <span class="alert__icon">!</span>
    <div class="alert__content">{{ error }}</div>
    <button type="button" class="alert__close" (click)="error = null" aria-label="Cerrar">×</button>
  </div>
  }

  @if (success) {
  <div class="alert alert--success" role="status" aria-live="polite">
    <span class="alert__icon">✓</span>
    <div class="alert__content">{{ success }}</div>
    <button type="button" class="alert__close" (click)="success = null" aria-label="Cerrar">×</button>
  </div>
  }

  <app-ediciones (despublicada)="onDespublicada($event)" (edicionCreada)="cargarEdiciones()">
  </app-ediciones>
</section>
