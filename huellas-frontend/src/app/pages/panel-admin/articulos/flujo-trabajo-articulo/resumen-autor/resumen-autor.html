<div class="panel-container">
  <section class="table-section" *ngIf="articulo">

    <!-- Cabecera interactiva -->
    <div class="table-header" (click)="toggleResumenEnvio()" role="button" tabindex="0">
      <div class="header-titles">
        <span class="section-kicker">CONTEXTO EDITORIAL</span>
        <h2>Información enviada por el autor</h2>
      </div>
      <button type="button" class="btn-outline-sm toggle-button" [class.active]="resumenEnvioExpandido">
        {{ resumenEnvioExpandido ? 'Ocultar detalles' : 'Ver detalles' }}
        <svg [class.rotate]="resumenEnvioExpandido" class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16"
          height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- Contenido expandible -->
    <div class="resumen-content" *ngIf="resumenEnvioExpandido">

      <div class="metadata-grid">
        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Autores
          </div>
          <div class="metadata-value">{{ autoresArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            Temas
          </div>
          <div class="metadata-value">{{ temasArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            Palabras clave
          </div>
          <div class="metadata-value tag-list">{{ palabrasClaveArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Fecha de envío
          </div>
          <div class="metadata-value">{{ fechaEnvioArticulo }}</div>
        </div>
      </div>

      <div class="resumen-section">
        <div class="metadata-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="21" y1="10" x2="3" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="14" y1="18" x2="3" y2="18"></line>
          </svg>
          RESUMEN
        </div>
        <div class="metadata-value resumen-text">
          {{ resumenArticulo }}
        </div>
      </div>

      <!-- Artículo Enviado por el Autor -->
      <div class="resumen-section" *ngIf="documentoArticuloInicial" style="margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1.2rem;">
        <div class="metadata-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          ARTÍCULO ENVIADO POR EL AUTOR
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.8rem 1rem; margin-top: 0.6rem;">
          <span style="font-weight: 600; color: #334155; font-size: 0.95rem;">{{ documentoArticuloInicial.nombre }}</span>
          <button type="button" (click)="descargarDocumento(documentoArticuloInicial.path, documentoArticuloInicial.nombre)"
            style="background: #1f4e5b; color: #ffffff; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;">
            Descargar
          </button>
        </div>
      </div>

    </div>
  </section>
</div>
