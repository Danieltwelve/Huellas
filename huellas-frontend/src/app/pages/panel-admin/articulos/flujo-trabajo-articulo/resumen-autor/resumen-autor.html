<div class="panel-container">
  <section class="table-section" *ngIf="articulo">

    <!-- Cabecera interactiva -->
    <div class="table-header" (click)="toggleResumenEnvio()" role="button" tabindex="0">
      <div class="header-titles">
        <span class="section-kicker">CONTEXTO EDITORIAL</span>
        <h2>Información enviada por el autor</h2>
      </div>
      <button type="button" class="btn-outline-sm toggle-button" [class.active]="resumenEnvioExpandido">
        {{ resumenEnvioExpandido ? 'Ocultar detalles' : 'Ver detalles' }}
        <svg [class.rotate]="resumenEnvioExpandido" class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16"
          height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- Contenido expandible -->
    <div class="resumen-content" *ngIf="resumenEnvioExpandido">

      <div class="metadata-grid">
        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Autores
          </div>
          <div class="metadata-value">{{ autoresArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            Temas
          </div>
          <div class="metadata-value">{{ temasArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            Palabras clave
          </div>
          <div class="metadata-value tag-list">{{ palabrasClaveArticulo }}</div>
        </div>

        <div class="metadata-item">
          <div class="metadata-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Fecha de envío
          </div>
          <div class="metadata-value">{{ fechaEnvioArticulo }}</div>
        </div>
      </div>

      <div class="resumen-section">
        <div class="metadata-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="21" y1="10" x2="3" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="14" y1="18" x2="3" y2="18"></line>
          </svg>
          RESUMEN
        </div>
        <div class="metadata-value resumen-text">
          {{ resumenArticulo }}
        </div>
      </div>

    </div>
  </section>
</div>
