<section class="notify-page">
  <div class="notify-toolbar">
    <div class="notify-filters">
      <button type="button" [class.active]="filtro === 'todas'" (click)="setFiltro('todas')">Todas</button>
      <button type="button" [class.active]="filtro === 'no-leidas'" (click)="setFiltro('no-leidas')">No leidas</button>
    </div>
    <button type="button" class="ghost" (click)="marcarTodasLeidas()">Marcar todo como leido</button>
  </div>

  <br>
  <div class="notify-list">
    @if (loading) {
      <article class="notify-empty">Cargando notificaciones...</article>
    }

    @if (!loading && !notificaciones.length) {
      <article class="notify-empty">
        No hay notificaciones pendientes para este filtro.
      </article>
    }

    @for (n of visibles; track n.id) {
      <article class="notify-item" [class.unread]="!n.leida" (click)="abrirNotificacion(n)">
        <span class="type"
              [class.type-action]="n.tipo === 'vencido' || n.tipo === 'proximo-vencer'"
              [class.type-info]="n.tipo === 'nuevo-articulo' || n.tipo === 'sin-revisar'"></span>
        <div>
          <h3>{{ n.titulo }}</h3>
          @if (n.mensaje) {
            <p>{{ n.mensaje }}</p>
          }
          @if (n.codigo) {
            <small class="article-ref">{{ n.codigo }}</small>
          }
        </div>
        <span class="date">{{ formatearFecha(n.fecha) }}</span>
      </article>
    }
  </div>
</section>
